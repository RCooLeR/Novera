name: Performance

on:
  schedule:
    - cron: "31 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.0"
  GOTOOLCHAIN: local

jobs:
  large-file-benchmarks:
    name: Large-file benchmark evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify module inputs
        run: |
          go mod verify
          go mod tidy -diff

      - name: Record benchmark environment
        run: |
          {
            echo "commit=$GITHUB_SHA"
            echo "runner_image=${ImageOS:-unknown}-${ImageVersion:-unknown}"
            echo "architecture=$(uname -m)"
            go version
            go env GOOS GOARCH GOAMD64 GOTOOLCHAIN
          } > benchmark-environment.txt

      - name: Run stable large-file benchmarks
        run: |
          set -o pipefail
          go test -run '^$' -bench Benchmark -benchmem -count 5 \
            ./internal/bigfile/document \
            ./internal/bigfile/lineindex \
            ./internal/bigfile/manualedit \
            ./internal/bigfile/search | tee benchmark-results.txt

      - name: Upload raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: large-file-benchmarks-${{ github.sha }}
          path: |
            benchmark-environment.txt
            benchmark-results.txt
          if-no-files-found: error
          retention-days: 90
