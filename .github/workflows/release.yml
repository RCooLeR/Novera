name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.26.4"
  NODE_VERSION: "24"
  TASK_VERSION: "v3.51.1"
  WAILS_VERSION: "v3.0.0-alpha.79"

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            os: windows-latest
          - target: darwin-universal
            os: macos-latest
          - target: linux-amd64
            os: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Install Wails and Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Build Windows app
        if: matrix.target == 'windows-amd64'
        run: task build

      - name: Build macOS app bundle
        if: matrix.target == 'darwin-universal'
        run: task darwin:package:universal

      - name: Build Linux app
        if: matrix.target == 'linux-amd64'
        run: task build

      - name: Create Windows archive
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        run: |
          $stage = "dist/windows/Novera"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "bin/Novera.exe" "$stage/Novera.exe"
          Copy-Item "README.md" "$stage/README.md"
          New-Item -ItemType Directory -Force "dist/release" | Out-Null
          Compress-Archive -Path $stage -DestinationPath "dist/release/Novera_${{ github.ref_name }}_windows_amd64.zip" -Force

      - name: Create macOS archive
        if: matrix.target == 'darwin-universal'
        run: |
          mkdir -p dist/release
          ditto -c -k --keepParent bin/Novera.app "dist/release/Novera_${GITHUB_REF_NAME}_darwin_universal.zip"

      - name: Create Linux archive
        if: matrix.target == 'linux-amd64'
        run: |
          mkdir -p dist/linux/Novera dist/release
          cp bin/Novera dist/linux/Novera/Novera
          cp README.md dist/linux/Novera/README.md
          cp build/appicon.png dist/linux/Novera/Novera.png
          if [ -f build/linux/Novera.desktop ]; then
            cp build/linux/Novera.desktop dist/linux/Novera/Novera.desktop
          fi
          tar -czf "dist/release/Novera_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -C dist/linux Novera

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

  goreleaser:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs: package
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist/release
        run: sha256sum * > checksums.txt

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
