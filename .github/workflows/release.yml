name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.0"
  GOTOOLCHAIN: local
  NODE_VERSION: "24.20.0"
  TASK_VERSION: "v3.53.1"
  WAILS_VERSION: "v3.0.0-beta.15"

jobs:
  release-gate:
    name: Release publication intentionally disabled
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Block unvalidated release publication
        run: |
          echo "::error::Release publication is disabled until the tag commit passes reusable validation, version identity checks, signing, and provenance gates."
          exit 1

  package:
    name: Package ${{ matrix.target }}
    needs: release-gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            os: windows-latest
          - target: darwin-universal
            os: macos-latest
          - target: linux-amd64
            os: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Install Wails and Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Derive canonical runtime build identity
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH with an optional SemVer suffix"
            exit 1
          fi
          echo "NOVERA_BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "NOVERA_BUILD_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "NOVERA_BUILD_DATE=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_ENV"
          channel=stable
          if [[ "$version" == *-* ]]; then
            channel=prerelease
          fi
          echo "NOVERA_BUILD_CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Build Windows app
        if: matrix.target == 'windows-amd64'
        run: task build

      - name: Build macOS app bundle
        if: matrix.target == 'darwin-universal'
        run: task darwin:package:universal

      - name: Build Linux app
        if: matrix.target == 'linux-amd64'
        run: task build

      - name: Create Windows archive
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        run: |
          $stage = "dist/windows/Novera"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "bin/Novera.exe" "$stage/Novera.exe"
          Copy-Item "README.md" "$stage/README.md"
          New-Item -ItemType Directory -Force "dist/release" | Out-Null
          Compress-Archive -Path $stage -DestinationPath "dist/release/Novera_${{ github.ref_name }}_windows_amd64.zip" -Force

      - name: Create macOS archive
        if: matrix.target == 'darwin-universal'
        run: |
          mkdir -p dist/release
          ditto -c -k --keepParent bin/Novera.app "dist/release/Novera_${GITHUB_REF_NAME}_darwin_universal.zip"

      - name: Create Linux archive
        if: matrix.target == 'linux-amd64'
        run: |
          mkdir -p dist/linux/Novera dist/release
          cp bin/Novera dist/linux/Novera/Novera
          cp README.md dist/linux/Novera/README.md
          cp build/appicon.png dist/linux/Novera/Novera.png
          if [ -f build/linux/Novera.desktop ]; then
            cp build/linux/Novera.desktop dist/linux/Novera/Novera.desktop
          fi
          tar -czf "dist/release/Novera_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -C dist/linux Novera

      - name: Generate CycloneDX SBOM for packaged artifact
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/release
          format: cyclonedx-json
          output-file: dist/release/Novera_${{ github.ref_name }}_${{ matrix.target }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Record target build environment
        shell: bash
        run: |
          {
            echo "target=${{ matrix.target }}"
            echo "tag=$GITHUB_REF_NAME"
            echo "commit=$GITHUB_SHA"
            echo "runner_image=${ImageOS:-unknown}-${ImageVersion:-unknown}"
            echo "source_date_epoch=$SOURCE_DATE_EPOCH"
            echo "go_version=$(go version)"
            echo "node_version=$(node --version)"
            echo "task_version=$TASK_VERSION"
            echo "wails_version=$WAILS_VERSION"
          } > "dist/release/Novera_${GITHUB_REF_NAME}_${{ matrix.target }}.build-environment.txt"

      - name: Upload release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

  goreleaser:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs: package
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist/release
        run: sha256sum * > checksums.txt

      - name: Attest release artifacts and evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/release/*

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.18.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
