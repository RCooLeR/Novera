name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.1"
  GOTOOLCHAIN: local
  NODE_VERSION: "24.21.0"
  TASK_VERSION: "v3.53.1"
  WAILS_VERSION: "v3.0.0-beta.23"

jobs:
  goreleaser-check:
    name: GoReleaser config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.18.2"
          install-only: true

      - name: Check GoReleaser config
        run: goreleaser check

  test-build:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: src/go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Install Wails and Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Verify Go module files
        run: |
          go -C src mod verify
          go -C src mod tidy -diff

      # Build renderer assets before compiling the module's main package:
      # src/main.go embeds frontend/dist relative to src/.
      - name: Frontend checks and embeddable production assets
        working-directory: src/frontend
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run typecheck
          npm run lint
          npm run test
          npm run build

      - name: Go tests
        if: runner.os != 'Windows'
        run: go -C src test . ./internal/... ./build/scripts

      - name: Go tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GOTMPDIR = Join-Path $pwd ".gotmp-ci"
          New-Item -ItemType Directory -Force $env:GOTMPDIR | Out-Null
          go -C src test . ./internal/... ./build/scripts

      - name: Go vet
        run: go -C src vet . ./internal/... ./build/scripts

      - name: Go race tests
        if: runner.os == 'Linux'
        run: go -C src test -race -timeout 5m . ./internal/...

      - name: Production build
        run: task build

      - name: Assert build did not mutate tracked source
        run: git diff --exit-code -- src/go.mod src/go.sum src/frontend/bindings

  go-vulnerability-check:
    name: Go vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: src/go.sum

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      # govulncheck loads the module's main package, whose production entry point
      # embeds src/frontend/dist. The renderer is not executed by this analysis.
      - name: Prepare embeddable frontend assets
        run: |
          mkdir -p src/frontend/dist
          printf '<!doctype html><title>govulncheck placeholder</title>\n' > src/frontend/dist/index.html

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Scan reachable Go vulnerabilities
        working-directory: src
        run: govulncheck . ./internal/...

  clean-export:
    name: Clean-export source build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout full source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Export only tracked source
        run: |
          mkdir -p "$RUNNER_TEMP/novera-export"
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$RUNNER_TEMP/novera-export"
          test ! -d "$RUNNER_TEMP/novera-export/.git"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: src/go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Install pinned Wails and Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Validate and build from clean export
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/novera-export"
          go -C src mod verify
          go -C src mod tidy -diff
          (
            cd src/frontend
            npm ci
            npm audit --audit-level=moderate
            npm run typecheck
            npm run lint
            npm run test
            npm run build
          )
          go -C src test . ./internal/... ./build/scripts
          go -C src vet . ./internal/... ./build/scripts
          task build
          test -x bin/Novera
